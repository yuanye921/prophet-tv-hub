<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-labelledby="title desc">
  <title id="title">HPTI 海报</title>
  <desc id="desc">看看你是哪块边角料</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2dfaa"/>
      <stop offset="1" stop-color="#d8b765"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#d8b765" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.44"/>
    </filter>
  </defs>

  <rect width="600" height="800" fill="#070907"/>
  <rect width="600" height="800" fill="url(#grid)"/>
  <rect x="28" y="30" width="544" height="740" rx="12" fill="#101912" fill-opacity="0.78" stroke="#d8b765" stroke-opacity="0.22"/>
  <path d="M0 644C128 612 196 668 312 636C414 608 468 532 600 552V800H0Z" fill="#0b120d" opacity="0.86"/>

  <g transform="translate(48 56)" filter="url(#softShadow)">
    <rect x="0" y="0" width="72" height="72" rx="10" fill="url(#gold)"/>
    <text x="36" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#0b120d">HP</text>
    <text x="92" y="31" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="26" font-weight="900" fill="#eee6cd">HPTI</text>
    <text x="92" y="56" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#eee6cd" opacity="0.54">HARRY POTTER TYPE INDICATOR</text>
  </g>

  <g transform="translate(48 186)">
    <text x="0" y="0" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#d8b765">MINISTRY SIDE-CHARACTER DOSSIER</text>
    <text x="0" y="114" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="116" font-weight="950" fill="#eee6cd">HPTI</text>
    <text x="0" y="178" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="43" font-weight="950" fill="#eee6cd">看看你是哪块</text>
    <text x="0" y="238" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="58" font-weight="950" fill="#eee6cd">边角料</text>
    <rect x="0" y="270" width="276" height="8" rx="4" fill="#a9d79c"/>
    <rect x="288" y="270" width="138" height="8" rx="4" fill="#d8b765"/>
  </g>

  <g transform="translate(48 524)">
    <rect x="0" y="0" width="504" height="132" rx="8" fill="#0b120d" fill-opacity="0.86" stroke="#d8b765" stroke-opacity="0.28"/>
    <text x="28" y="43" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="900" fill="#d8b765">30 题检测你的原著背景板含量</text>
    <text x="28" y="82" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#d8d0b8">哑炮邻居、夜班售票员、幽灵课件、魔法部倒霉公务员</text>
    <text x="28" y="112" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#d8d0b8">一起生成一份看起来很正式的边角料人格报告。</text>
  </g>

  <g transform="translate(48 700)">
    <rect x="0" y="0" width="208" height="46" rx="8" fill="url(#gold)"/>
    <text x="104" y="30" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18" font-weight="900" fill="#0b120d">开始测试</text>
    <text x="232" y="30" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#eee6cd" opacity="0.5">hpti.yuyanjia.top</text>
  </g>

  <g transform="translate(398 96) rotate(-8)">
    <rect x="0" y="0" width="130" height="42" fill="none" stroke="#8e2f2a" stroke-opacity="0.56" stroke-width="2"/>
    <text x="65" y="27" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="900" fill="#8e2f2a" opacity="0.7">ARCHIVED</text>
  </g>
</svg>
